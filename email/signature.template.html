<!-- The email signature. `just build` fills every {slot} from src/profile.json, once per language,
     and writes signature.html (English) and signature.es.html (Spanish) to dist/email/ and to the
     site. Mail clients keep only tables and inline styles, and no web fonts, so the name falls back
     to Menlo or Consolas, and the block is a table cell with a background, not an image: nothing
     to host, nothing for a client to block. -->
<table
  role="presentation"
  cellpadding="0"
  cellspacing="0"
  border="0"
  style="
    border-collapse: collapse;
    border-top: 1px solid #d6d0c4;
    font-family:
      &quot;JetBrains Mono&quot;, Menlo, Consolas, &quot;Courier New&quot;,
      monospace;
  "
>
  <tr>
    <td style="padding: 12px 0 0">
      <table
        role="presentation"
        cellpadding="0"
        cellspacing="0"
        border="0"
        style="border-collapse: collapse"
      >
        <tr>
          <td
            style="
              padding: 0;
              font-size: 14px;
              line-height: 20px;
              font-weight: bold;
              color: #17171a;
            "
          >
            {name}
          </td>
          <td valign="bottom" style="padding: 0 0 5px 3px">
            <table
              role="presentation"
              cellpadding="0"
              cellspacing="0"
              border="0"
              style="border-collapse: collapse"
            >
              <tr>
                <td
                  width="6"
                  height="6"
                  bgcolor="#d76037"
                  style="
                    width: 6px;
                    height: 6px;
                    padding: 0;
                    font-size: 0;
                    line-height: 0;
                    background-color: #d76037;
                  "
                >
                  &nbsp;
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td
      style="
        padding: 2px 0 0;
        font-size: 12px;
        line-height: 18px;
        color: #5d5b56;
      "
    >
      {role} &middot; {location}
    </td>
  </tr>
  <tr>
    <td style="padding: 2px 0 0; font-size: 12px; line-height: 18px">
      <a href="{website}" style="color: #a63f1b; text-decoration: none"
        >{websiteLabel}</a
      >
      <span style="color: #5d5b56">&middot;</span>
      <a href="{linkedin}" style="color: #5d5b56; text-decoration: none"
        >LinkedIn</a
      >
      <span style="color: #5d5b56">&middot;</span>
      <a href="{github}" style="color: #5d5b56; text-decoration: none"
        >GitHub</a
      >
      <span style="color: #5d5b56">&middot;</span>
      <a href="{youtube}" style="color: #5d5b56; text-decoration: none"
        >YouTube</a
      >
    </td>
  </tr>
</table>
